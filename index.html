<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Something Amazing is Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .particle:nth-child(1) {
      width: 20px;
      height: 20px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      width: 30px;
      height: 30px;
      top: 60%;
      left: 20%;
      animation-delay: -2s;
    }

    .particle:nth-child(3) {
      width: 15px;
      height: 15px;
      top: 40%;
      left: 70%;
      animation-delay: -4s;
    }

    .particle:nth-child(4) {
      width: 25px;
      height: 25px;
      top: 80%;
      left: 80%;
      animation-delay: -1s;
    }

    .particle:nth-child(5) {
      width: 18px;
      height: 18px;
      top: 30%;
      left: 90%;
      animation-delay: -3s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0.7;
      }

      50% {
        transform: translateY(-20px) rotate(180deg);
        opacity: 1;
      }
    }

    /* Glassmorphism container */
    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .coming-soon-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 60px 40px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.5s ease;
      animation: logoFloat 4s ease-in-out infinite;
      position: relative;
    }

    .logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
      transition: all 0.5s ease;
    }

    .logo:hover {
      transform: scale(1.1) rotate(3deg);
    }

    .logo:hover svg {
      filter: drop-shadow(0 15px 40px rgba(139, 111, 78, 0.4));
    }

    /* Logo animations */
    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      25% {
        transform: translateY(-5px) scale(1.02);
      }

      50% {
        transform: translateY(-10px) scale(1.05);
      }

      75% {
        transform: translateY(-5px) scale(1.02);
      }
    }

    /* Individual element animations */
    .logo-dome {
      animation: domeGlow 3s ease-in-out infinite alternate;
    }

    .logo-bird {
      animation: birdSoar 6s ease-in-out infinite;
      transform-origin: center;
    }

    .logo-wave {
      animation: waveFlow 4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @keyframes domeGlow {
      0% {
        filter: drop-shadow(0 0 5px rgba(139, 111, 78, 0.3));
      }

      100% {
        filter: drop-shadow(0 0 15px rgba(139, 111, 78, 0.6));
      }
    }

    @keyframes birdSoar {

      0%,
      100% {
        transform: translateX(0) rotate(0deg);
      }

      25% {
        transform: translateX(-2px) rotate(-1deg);
      }

      50% {
        transform: translateX(0) rotate(0deg);
      }

      75% {
        transform: translateX(2px) rotate(1deg);
      }
    }

    @keyframes waveFlow {

      0%,
      100% {
        transform: translateX(0) scaleX(1);
      }

      50% {
        transform: translateX(1px) scaleX(1.02);
      }
    }

    /* Text animations for Arabic text */
    .arabic-text {
      animation: arabicGlow 2s ease-in-out infinite alternate;
    }

    @keyframes arabicGlow {
      0% {
        filter: drop-shadow(0 2px 5px rgba(139, 111, 78, 0.3));
      }

      100% {
        filter: drop-shadow(0 2px 10px rgba(139, 111, 78, 0.6));
      }
    }

    h1 {
      color: white;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 0.1);
      }

      to {
        text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 0.3);
      }
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.2rem;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Countdown Timer */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 40px 0;
      flex-wrap: wrap;
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      min-width: 80px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    .countdown-item:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .countdown-number {
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      display: block;
    }

    .countdown-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Email signup */
    .email-signup {
      margin-top: 40px;
    }

    .email-form {
      display: flex;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .email-input {
      flex: 1;
      min-width: 200px;
      padding: 15px 20px;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .email-input:focus {
      background: white;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .notify-btn {
      padding: 15px 30px;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    .notify-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
    }

    .notify-btn:active {
      transform: translateY(0);
    }

    /* Social links */
    .social-links {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-link {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .social-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    /* Progress bar */
    .progress-section {
      margin-top: 40px;
    }

    .progress-label {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d);
      width: 0%;
      border-radius: 4px;
      animation: progressLoad 3s ease-out forwards;
    }

    @keyframes progressLoad {
      to {
        width: 75%;
      }
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .coming-soon-card {
        padding: 40px 20px;
        margin: 20px;
      }

      h1 {
        font-size: 2.5rem;
      }

      .countdown {
        gap: 15px;
      }

      .countdown-item {
        min-width: 60px;
        padding: 15px 10px;
      }

      .countdown-number {
        font-size: 1.8rem;
      }

      .email-form {
        flex-direction: column;
        gap: 15px;
      }

      .email-input,
      .notify-btn {
        width: 100%;
        min-width: auto;
      }
    }

    /* Loading animation */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: dotBounce 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="coming-soon-card">
      <div class="logo" onclick="rotateLogo()">
        <img src="./img/logo2.png" alt="Sindhi Salafi Da'wah Logo" class="logo-image" width="210" height="190">
      </div>

      <h1>Coming Soon</h1>
      <p class="subtitle">
        We're working hard to bring you something amazing.
        Get ready for an incredible experience that will blow your mind!
      </p>

      <div class="countdown">
        <div class="countdown-item">
          <span class="countdown-number" id="days">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="hours">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="minutes">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="seconds">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">Development Progress</div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="social-links">
        <a href="#" class="social-link" title="Twitter">🐦</a>
        <a href="#" class="social-link" title="Facebook">📘</a>
        <a href="#" class="social-link" title="Instagram">📷</a>
        <a href="#" class="social-link" title="LinkedIn">💼</a>
      </div>
    </div>
  </div>

  <script>
    // Countdown Timer
    function updateCountdown() {
      // Set launch date (choose only one option below)

      // Option 1: Fixed date
      const launchDate = new Date('2025-09-15T00:00:00'); // September 15, 2025

      const now = new Date().getTime();
      const distance = launchDate.getTime() - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days.toString().padStart(2, '0');
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }

    // Update countdown every second
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Logo rotation effect with image
    function rotateLogo() {
      const logo = document.querySelector('.logo');
      const logoImage = document.querySelector('.logo-image');

      // Main logo rotation with enhanced scale
      logo.style.transform = 'rotate(360deg) scale(1.3)';

      // Add extra glow to the image
      logoImage.style.filter = 'drop-shadow(0 20px 50px rgba(139, 111, 78, 0.6)) brightness(1.1)';

      setTimeout(() => {
        logo.style.transform = 'rotate(0deg) scale(1)';
        logoImage.style.filter = 'drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3))';
      }, 600);
    }

    // Email form submission
    function handleEmailSubmit(event) {
      event.preventDefault();

      const btn = document.querySelector('.notify-btn');
      const btnText = btn.querySelector('.btn-text');
      const loadingDots = btn.querySelector('.loading-dots');

      // Show loading state
      btnText.textContent = 'Subscribing';
      loadingDots.style.display = 'inline-flex';
      btn.disabled = true;

      // Simulate API call
      setTimeout(() => {
        btnText.textContent = 'Subscribed!';
        loadingDots.style.display = 'none';
        btn.style.background = 'linear-gradient(45deg, #4CAF50, #8BC34A)';

        // Reset after 2 seconds
        setTimeout(() => {
          btnText.textContent = 'Notify Me';
          btn.style.background = 'linear-gradient(45deg, #ff6b6b, #ffd93d)';
          btn.disabled = false;
          document.querySelector('.email-input').value = '';
        }, 2000);
      }, 1500);
    }

    // Add some interactivity to countdown items
    document.querySelectorAll('.countdown-item').forEach(item => {
      item.addEventListener('click', function () {
        this.style.transform = 'scale(1.1) translateY(-5px)';
        setTimeout(() => {
          this.style.transform = 'translateY(-5px)';
        }, 200);
      });
    });

    // Particle interaction
    document.addEventListener('mousemove', (e) => {
      const particles = document.querySelectorAll('.particle');
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      particles.forEach((particle, index) => {
        const speed = (index + 1) * 0.0002;
        const x = (mouseX - window.innerWidth / 2) * speed;
        const y = (mouseY - window.innerHeight / 2) * speed;

        particle.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>

</html>
